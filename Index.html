<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#000000;
  --grey-1:#5c5c5c;
  --grey-2:#8f8f8f;
  --grey-3:#c9c9c9;
  --hair:#e3e3e3;
  --ground:#ffffff;
  --wash:#f4f4f4;
  --pad:clamp(18px,4.5vw,64px);
  --gap:clamp(10px,1.4vw,18px);
  --font:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--ground);
  color:var(--ink);
  font-size:16px;
  line-height:1.5;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-0.005em;
}
img,video{display:block;max-width:100%}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- masthead: the logo bar expands horizontally to hold the nav ---------- */
#masthead{
  position:sticky;top:0;z-index:60;
  background:var(--ground);
  padding:14px var(--pad) 0;
  border-bottom:1px solid var(--hair);
}
.bar{display:flex;align-items:center;gap:clamp(14px,2.5vw,34px);padding-bottom:12px}
.brand{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.logo-slot{
  height:68px;min-width:68px;display:flex;align-items:center;
}
.logo-slot img{height:100%;width:auto;object-fit:contain}
.logo-empty{
  height:68px;padding:0 12px;border:1px dashed var(--grey-3);color:var(--grey-2);
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;
}
.wordmark{
  font-size:14px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
}
.rule{flex:1 1 auto;height:1px;background:var(--ink);min-width:8px}
nav.pages{display:flex;gap:clamp(12px,2vw,28px);flex:0 0 auto}
nav.pages button{
  font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-2);
  padding:2px 0;border-bottom:1px solid transparent;transition:color .15s
}
nav.pages button:hover{color:var(--ink)}
nav.pages button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
@media(max-width:760px){
  .bar{flex-wrap:wrap;gap:10px}
  .rule{order:3;flex-basis:100%;height:1px;margin-top:2px}
  nav.pages{order:4;flex-basis:100%;overflow-x:auto;padding-bottom:2px;gap:18px}
  .wordmark{font-size:12px}
}

/* ---------- page furniture ---------- */
main{padding:0 var(--pad) 120px}
.page{max-width:1680px;margin:0 auto}
.page-head{padding:clamp(48px,9vw,120px) 0 clamp(30px,5vw,56px);border-bottom:1px solid var(--hair)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey-2);margin-bottom:clamp(20px,4vw,44px)}
.page-title{
  font-size:clamp(30px,5.4vw,64px);line-height:1.04;font-weight:400;letter-spacing:-0.02em;margin:0 0 22px;max-width:20ch
}
.lede{font-size:clamp(15px,1.35vw,19px);line-height:1.55;color:var(--grey-1);max-width:56ch;margin:0}

.section{padding:clamp(46px,7vw,96px) 0;border-bottom:1px solid var(--hair)}
.section:last-of-type{border-bottom:0}
.section-head{display:flex;align-items:baseline;gap:16px;margin-bottom:clamp(22px,3.5vw,40px)}
.section-head .rule{background:var(--hair)}
.section-title{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:400;margin:0;white-space:nowrap}
.count{font-size:12px;color:var(--grey-2);letter-spacing:.08em}

/* ---------- projects ---------- */
.project{padding:clamp(46px,7vw,104px) 0;border-bottom:1px solid var(--hair)}
.project:last-child{border-bottom:0}
.project-top{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(18px,4vw,72px);align-items:start}
.project.flip .project-top{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.project.flip .col-title{order:2}
.project.flip .col-body{order:1;padding-top:clamp(0px,2vw,26px)}
.project.indent .project-top{padding-left:0}
.project.indent .col-title{padding-left:clamp(0px,8vw,140px)}
@media(max-width:860px){
  .project-top,.project.flip .project-top{grid-template-columns:1fr;gap:20px}
  .project.flip .col-title{order:1}
  .project.flip .col-body{order:2;padding-top:0}
  .project.indent .col-title{padding-left:0}
}
.index{font-size:11px;letter-spacing:.16em;color:var(--grey-2);margin-bottom:14px}
.project-title{font-size:clamp(26px,3.6vw,46px);line-height:1.08;font-weight:400;letter-spacing:-0.02em;margin:0 0 18px}
.quote{
  font-size:clamp(16px,1.7vw,23px);line-height:1.4;color:var(--grey-1);font-weight:300;
  margin:0;max-width:40ch;text-wrap:balance
}
.body-copy{font-size:15.5px;line-height:1.62;color:var(--grey-1);margin:0;max-width:58ch;white-space:pre-wrap}
.project-media{margin-top:clamp(26px,4vw,52px)}

/* media grids */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap)}
.grid-1{display:grid;grid-template-columns:1fr;gap:var(--gap)}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}}

/* justified rows: row height is fixed, each image's width is set by its own
   real aspect ratio, so portrait and landscape shots sit side by side at
   different widths within the same row — this is how the reference behaves */
.media-rows{display:flex;flex-direction:column;gap:var(--gap)}
.jrow{display:flex;gap:var(--gap);height:var(--rh)}
.jitem{position:relative;overflow:hidden;background:var(--wash);height:100%}
.jrow-solo{width:100%}
@media(max-width:700px){
  .jrow{flex-direction:column;height:auto}
  .jitem{height:clamp(220px,62vw,340px)}
}
.media{position:relative;background:var(--wash);overflow:hidden}
.media.ratio-4x3::before{content:"";display:block;padding-top:75%}
.media.ratio-16x9::before{content:"";display:block;padding-top:56.25%}
.media.ratio-1x1::before{content:"";display:block;padding-top:100%}
.fill{width:100%;height:100%;object-fit:cover;display:block;border:0}
.media > .fill{position:absolute;inset:0}
.jitem > .fill{position:static}
.placeholder{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--hair);color:var(--grey-2);font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:12px
}
.placeholder small{letter-spacing:.02em;text-transform:none;font-size:11px;color:var(--grey-3)}
.media.clickable{cursor:zoom-in}
.media-tools{position:absolute;top:8px;right:8px;display:none;gap:6px;z-index:3;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 16px)}
body.editing .media-tools{display:flex}
.chip{
  background:var(--ground);border:1px solid var(--ink);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 8px;line-height:1
}
.chip.icon{padding:5px 10px;min-width:26px;text-align:center;letter-spacing:0;font-size:13px}
.chip:hover{background:var(--ink);color:var(--ground)}
.add-box{
  display:none;align-items:center;justify-content:center;border:1px dashed var(--grey-3);color:var(--grey-1);
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;min-height:90px
}
body.editing .add-box{display:flex}
.add-box:hover{border-color:var(--ink);color:var(--ink)}
.row-tools{display:none;gap:10px 16px;margin-top:14px;align-items:center;flex-wrap:wrap}
body.editing .row-tools{display:flex}
.tool-link{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--grey-1);border-bottom:1px solid var(--grey-3);padding-bottom:2px}
.tool-link:hover{color:var(--ink);border-color:var(--ink)}
.caption{font-size:12px;color:var(--grey-2);margin-top:8px;letter-spacing:.01em}

/* ---------- documents ---------- */
.doc{display:block;text-align:left;width:100%}
.doc .media{transition:opacity .2s}
.doc:hover .media{opacity:.82}
.doc-title{font-size:17px;margin:14px 0 4px;font-weight:400;letter-spacing:-0.01em}
.doc-meta{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--grey-2);display:block;text-align:left}
.doc-meta:hover{color:var(--ink)}
.doc-missing{color:var(--grey-3)}

/* ---------- horizontal slider ---------- */
.slider{position:relative;background:var(--wash)}
.slider-window{overflow:hidden}
.slider-track{display:flex;transition:transform .55s cubic-bezier(.22,.61,.36,1);will-change:transform}
.slide{flex:0 0 100%;position:relative;aspect-ratio:16/9;background:var(--wash)}
.slide img{width:100%;height:100%;object-fit:cover}
.slide .empty-slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--grey-2);font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--hair)}
.slider-bar{display:flex;align-items:center;gap:18px;margin-top:14px}
.arrow{
  width:42px;height:42px;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;
  transition:background .15s,color .15s
}
.arrow:hover{background:var(--ink);color:var(--ground)}
.arrow[disabled]{border-color:var(--grey-3);color:var(--grey-3);cursor:default;background:none}
.slider-count{font-size:12px;letter-spacing:.1em;color:var(--grey-2);font-variant-numeric:tabular-nums}
.slider-progress{flex:1;height:1px;background:var(--hair);position:relative}
.slider-progress i{position:absolute;left:0;top:0;height:100%;background:var(--ink);transition:width .45s ease}

/* ---------- photography ---------- */
.photo-grid{columns:3;column-gap:var(--gap)}
@media(max-width:1000px){.photo-grid{columns:2}}
@media(max-width:620px){.photo-grid{columns:1}}
.photo-grid .cell{break-inside:avoid;margin-bottom:var(--gap);position:relative;background:var(--wash)}
.photo-grid .cell img{width:100%;height:auto;cursor:zoom-in}

/* ---------- about ---------- */
.about-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(20px,4vw,72px);align-items:start}
@media(max-width:860px){.about-top{grid-template-columns:1fr}}
.vol{padding-top:clamp(30px,4vw,56px)}
.vol + .vol{border-top:1px solid var(--hair);margin-top:clamp(30px,4vw,56px)}
.vol-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(20px,4vw,72px);margin-bottom:26px}
@media(max-width:860px){.vol-head{grid-template-columns:1fr;gap:14px}}
.vol-title{font-size:clamp(22px,2.6vw,32px);font-weight:400;letter-spacing:-0.02em;margin:0}
.vol-role{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-2);margin-top:10px}

/* ---------- editing affordances ---------- */
[data-bind]{transition:background .12s}
body.editing [data-bind]{
  outline:1px dashed var(--grey-3);outline-offset:5px;min-height:1em;min-width:2ch;display:inline-block
}
body.editing p[data-bind],body.editing h1[data-bind],body.editing h2[data-bind],body.editing h3[data-bind]{display:block}
body.editing [data-bind]:hover{background:#fafafa}
body.editing [data-bind]:focus{outline:1px solid var(--ink);background:#fff}

.field-wrap{position:relative;display:block;width:fit-content;max-width:100%}
.field-del{
  display:none;position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;
  align-items:center;justify-content:center;background:var(--ink);color:var(--ground);
  font-size:13px;line-height:1;border:1px solid var(--ground);cursor:pointer;z-index:6;padding:0
}
body.editing .field-wrap:hover .field-del,
body.editing .field-wrap:focus-within .field-del{display:flex}
.field-del:hover{opacity:.8}

/* toolbar */
#toolbar{
  position:fixed;right:16px;bottom:16px;z-index:80;display:flex;align-items:center;gap:8px;
  background:var(--ground);border:1px solid var(--ink);padding:8px
}
#toolbar button{font-size:11px;letter-spacing:.11em;text-transform:uppercase;padding:8px 10px;white-space:nowrap}
#toolbar button:hover{background:var(--wash)}
#toolbar button.primary{background:var(--ink);color:var(--ground)}
#toolbar button.primary:hover{opacity:.85}
#toolbar .divider{width:1px;align-self:stretch;background:var(--hair)}
@media(max-width:620px){#toolbar{left:12px;right:12px;bottom:12px;justify-content:space-between;gap:3px;flex-wrap:wrap}#toolbar button{padding:7px 5px;font-size:9.5px}}

#toast{
  position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:90;
  background:var(--ink);color:var(--ground);font-size:12px;letter-spacing:.04em;padding:11px 16px;max-width:min(90vw,460px);
  opacity:0;pointer-events:none;transition:opacity .25s
}
#toast.show{opacity:1}

/* modal */
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:20px}
#modal.open{display:flex}
.modal-card{background:var(--ground);width:min(420px,100%);padding:26px;border:1px solid var(--ink)}
.modal-card h3{margin:0 0 6px;font-size:15px;font-weight:400;letter-spacing:-0.01em}
.modal-card p{margin:0 0 20px;font-size:13px;color:var(--grey-1);line-height:1.5}
.modal-actions{display:flex;flex-direction:column;gap:8px}
.modal-actions button{border:1px solid var(--hair);padding:12px 14px;text-align:left;font-size:13px}
.modal-actions button:hover{border-color:var(--ink)}
.modal-card input[type=text]{width:100%;padding:11px;border:1px solid var(--hair);font-family:inherit;font-size:13px;margin-bottom:12px}
.modal-card input[type=text]:focus{outline:none;border-color:var(--ink)}
.modal-close{margin-top:16px;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--grey-2)}

/* lightbox */
#lightbox{position:fixed;inset:0;z-index:95;display:none;background:#fff}
#lightbox.open{display:block}
#lightbox .lb-stage{position:absolute;inset:56px 0 72px;display:flex;align-items:center;justify-content:center;padding:0 clamp(12px,5vw,80px)}
#lightbox img,#lightbox video{max-width:100%;max-height:100%;object-fit:contain}
#lightbox .lb-bar{position:absolute;left:0;right:0;bottom:0;height:72px;display:flex;align-items:center;gap:18px;padding:0 var(--pad);border-top:1px solid var(--hair)}
#lightbox .lb-close{position:absolute;top:0;right:0;height:56px;padding:0 var(--pad);display:flex;align-items:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase}

footer.site{padding:clamp(30px,5vw,60px) var(--pad);border-top:1px solid var(--hair);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--grey-2)}
.hidden{display:none!important}
</style>
</head>
<body>

<header id="masthead"></header>
<main id="app"></main>
<footer class="site">
  <span data-bind="footer.left">Auckland, New Zealand</span>
  <span data-bind="footer.right">© 2026</span>
</footer>

<div id="toolbar">
  <button id="btnEdit" class="primary">Edit site</button>
  <button id="btnSave">Save</button>
  <span class="divider"></span>
  <button id="btnExport">Export</button>
  <button id="btnImport">Import</button>
  <button id="btnHelp">Help</button>
</div>

<div id="toast"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="modal-card" id="modalCard"></div></div>
<div id="lightbox" role="dialog" aria-modal="true">
  <button class="lb-close" data-act="lb-close">Close</button>
  <div class="lb-stage" id="lbStage"></div>
  <div class="lb-bar">
    <button class="arrow" data-act="lb-prev" aria-label="Previous">←</button>
    <button class="arrow" data-act="lb-next" aria-label="Next">→</button>
    <span class="slider-count" id="lbCount"></span>
  </div>
</div>

<input type="file" id="filePicker" class="hidden">
<script id="seed" type="application/json"></script>

<script>
/* ============================================================
   STATE
   ============================================================ */
const STORE_KEY = 'portfolio-site-v1';
const uid = () => Math.random().toString(36).slice(2, 9);

const img = () => ({ id: uid(), kind: 'image', src: '', caption: '', ratio: 4 / 3 });
const vid = () => ({ id: uid(), kind: 'video', src: '', embed: '', caption: '', ratio: 16 / 9 });

function defaultState() {
  const project = (title, videoMode) => ({
    id: uid(),
    title,
    quote: 'A short quote or one-line thesis for the project.',
    body: 'Write 80–120 words here: the brief, your role on it, the constraints you worked through, and how it landed. Keep it plain and specific — what you actually did.',
    media: videoMode ? [vid()] : [img(), img(), img(), img()]
  });
  return {
    logo: '',
    wordmark: 'Your Name',
    page: 'projects',
    footer: { left: 'Auckland, New Zealand', right: '© 2026' },
    projects: {
      eyebrow: 'Selected work',
      title: 'Projects',
      lede: 'Every project shown here is one I led or project managed — from early coordination through to handover. Titles, roles and dates are noted with each.',
      items: [
        project('Project one', true),
        project('Project two', true),
        project('Project three', false),
        project('Project four', false),
        project('Project five', false),
        project('Project six', false)
      ]
    },
    documentation: {
      eyebrow: 'Drawing sets & concepts',
      title: 'Documentation',
      lede: 'Construction documentation and concept work. Open any thumbnail to read the full PDF.',
      order: ['construction', 'concept', 'gallery'],
      construction: {
        title: 'Construction documentation',
        items: [
          { id: uid(), title: 'Project one — drawing set', meta: 'PDF', thumb: '', pdf: '', pdfName: '' },
          { id: uid(), title: 'Project two — drawing set', meta: 'PDF', thumb: '', pdf: '', pdfName: '' }
        ]
      },
      concept: {
        title: 'Concept documents',
        items: [
          { id: uid(), title: 'Concept document one', meta: 'PDF', thumb: '', pdf: '', pdfName: '' },
          { id: uid(), title: 'Concept document two', meta: 'PDF', thumb: '', pdf: '', pdfName: '' }
        ]
      },
      gallery: { title: 'Site & process', items: [img(), img(), img()] }
    },
    photography: {
      eyebrow: 'Personal work',
      title: 'Photography',
      lede: 'An ongoing record — landscape, coast, people and the odd building.',
      items: [img(), img(), img(), img(), img(), img()]
    },
    about: {
      eyebrow: 'Background',
      title: 'About',
      portrait: '',
      bio: 'Two or three short paragraphs about you: your training, the kind of work you take on, how you run a project and what you care about doing well.\n\nAdd a line here about where you are based and what you are open to next.',
      volunteering: {
        title: 'Volunteering',
        items: [
          { id: uid(), title: 'Sustainable Coastlines', role: 'Volunteer — coastal clean-ups & restoration', body: 'A few sentences on what you do with the organisation, how long you have been involved and what you have contributed.', media: [img(), img(), img()] },
          { id: uid(), title: 'Boxing', role: 'Volunteer — coaching & club support', body: 'A few sentences on your involvement with the club, who you work with and what the role asks of you.', media: [img(), img(), img()] }
        ]
      }
    }
  };
}

let state = defaultState();
let editing = false;

/* path helpers */
function getPath(p) {
  return p.split('.').reduce((o, k) => (o == null ? o : o[/^\d+$/.test(k) ? Number(k) : k]), state);
}
function setPath(p, v) {
  const keys = p.split('.');
  const last = keys.pop();
  const target = keys.reduce((o, k) => o[/^\d+$/.test(k) ? Number(k) : k], state);
  target[/^\d+$/.test(last) ? Number(last) : last] = v;
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* generic reordering: itemPath ends in .N (an index into some array); swaps
   it with its neighbour in that direction. Works for any list — projects,
   media boxes, documents, photos, volunteering entries, even section order. */
function moveItem(itemPath, dir) {
  const cut = itemPath.lastIndexOf('.');
  const listPath = itemPath.slice(0, cut);
  const idx = Number(itemPath.slice(cut + 1));
  const list = getPath(listPath);
  const ni = idx + dir;
  if (!Array.isArray(list) || ni < 0 || ni >= list.length) return false;
  [list[idx], list[ni]] = [list[ni], list[idx]];
  return true;
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
let autosaveWarned = false;
async function save() {
  const payload = JSON.stringify(state);
  try {
    if (typeof window === 'undefined' || !window.storage) throw new Error('no storage available');
    let result;
    if (payload.length > 4_400_000) {
      const light = JSON.parse(payload);
      stripMedia(light);
      result = await window.storage.set(STORE_KEY, JSON.stringify(light));
      if (result && !autosaveWarned) toast('Text saved — media is too large to auto-save here, use Export to keep it.');
    } else {
      result = await window.storage.set(STORE_KEY, payload);
    }
    if (!result) throw new Error('storage.set returned no result');
    return true;
  } catch (e) {
    if (!autosaveWarned) {
      autosaveWarned = true;
      toast('Auto-save isn’t available in this window. Use Export before closing, so you don’t lose changes.');
    }
    return false;
  }
}
function stripMedia(o) {
  if (Array.isArray(o)) return o.forEach(stripMedia);
  if (o && typeof o === 'object') {
    for (const k of Object.keys(o)) {
      if (['src', 'thumb', 'pdf', 'logo', 'portrait'].includes(k) && typeof o[k] === 'string' && o[k].startsWith('data:')) o[k] = '';
      else stripMedia(o[k]);
    }
  }
}
async function load() {
  const seed = document.getElementById('seed').textContent.trim();
  if (seed) { try { state = Object.assign(defaultState(), JSON.parse(seed)); migrate(); return; } catch (e) {} }
  try {
    const r = await window.storage.get(STORE_KEY);
    if (r && r.value) state = Object.assign(defaultState(), JSON.parse(r.value));
  } catch (e) { /* first run */ }
  migrate();
}
function migrate() {
  if (!state.documentation) state.documentation = defaultState().documentation;
  if (!Array.isArray(state.documentation.order)) state.documentation.order = ['construction', 'concept', 'gallery'];
}

const picker = document.getElementById('filePicker');
let pickerCb = null;
function pickFile(accept, cb, multiple = false) {
  picker.value = '';
  picker.accept = accept;
  picker.multiple = multiple;
  pickerCb = cb;
  picker.click();
}
picker.addEventListener('change', () => {
  if (pickerCb && picker.files.length) pickerCb([...picker.files]);
  pickerCb = null;
});

function readDataURL(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}
function compressImage(file, maxDim = 1600, quality = 0.82) {
  return new Promise(async res => {
    const raw = await readDataURL(file);
    if (file.type === 'image/svg+xml') return res({ url: raw, ratio: 4 / 3 });
    const im = new Image();
    im.onload = () => {
      const s = Math.min(1, maxDim / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * s);
      c.height = Math.round(im.height * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      const alpha = file.type === 'image/png';
      const url = c.toDataURL(alpha ? 'image/png' : 'image/jpeg', quality);
      res({ url, ratio: im.width / im.height || 4 / 3 });
    };
    im.onerror = () => res({ url: raw, ratio: 4 / 3 });
    im.src = raw;
  });
}

function bind(tag, path, cls = '', extra = '') {
  const v = getPath(path);
  return `<span class="field-wrap" data-field="${path}">
    <${tag} class="${cls}" data-bind="${path}" ${extra}>${esc(v)}</${tag}>
    <button class="field-del" data-act="clear-field" data-path="${path}" title="Delete this text" aria-label="Delete this text">×</button>
  </span>`;
}

/* one media box, in its own fixed-aspect frame (used by Documentation / About) */
function mediaBox(listPath, index, ratio = 'ratio-4x3') {
  const { inner, tools, clickable, item, path } = mediaFill(listPath, index);
  return `<figure class="media ${item.kind === 'video' ? 'ratio-16x9' : ratio} ${clickable}" data-media="${path}" style="margin:0">${inner}${tools}</figure>`;
}

/* one media box, in its own fixed-aspect frame (used by Documentation / About) */
function mediaFill(listPath, index) {
  const list = getPath(listPath);
  const it = list[index];
  const p = `${listPath}.${index}`;
  let inner;
  if (it.kind === 'video' && it.embed) {
    inner = `<iframe class="fill" src="${esc(it.embed)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
  } else if (it.src) {
    inner = it.kind === 'video'
      ? `<video class="fill" src="${esc(it.src)}" controls preload="metadata" playsinline></video>`
      : `<img class="fill" src="${esc(it.src)}" alt="${esc(it.caption || '')}" loading="lazy">`;
  } else {
    inner = `<div class="placeholder">${it.kind === 'video' ? 'Video' : 'Image'}<small>Turn on Edit site, then click to add</small></div>`;
  }
  const moveEarlier = index > 0 ? `<button class="chip icon" data-act="move-item" data-path="${p}" data-dir="-1" title="Move earlier" aria-label="Move earlier">‹</button>` : '';
  const moveLater = index < list.length - 1 ? `<button class="chip icon" data-act="move-item" data-path="${p}" data-dir="1" title="Move later" aria-label="Move later">›</button>` : '';
  const tools = `<div class="media-tools">
      ${moveEarlier}${moveLater}
      <button class="chip" data-act="set-media" data-path="${p}">${it.src || it.embed ? 'Replace' : 'Add'}</button>
      <button class="chip" data-act="del-media" data-path="${p}">Remove</button>
    </div>`;
  const clickable = it.src && it.kind === 'image' ? 'clickable' : '';
  return { inner, tools, clickable, item: it, path: p };
}

/* justified-row layout for Projects: row height is fixed, each frame's width
   comes from its own image's real aspect ratio, so portrait and landscape
   shots land at different widths in the same row — no two rows the same shape */
const ROW_CYCLES = [[1, 3], [2, 2], [3, 1], [1, 2, 1]];
const ROW_HEIGHT = { 1: 'clamp(280px,36vw,560px)', 2: 'clamp(220px,27vw,420px)', 3: 'clamp(175px,20vw,300px)' };
function rowHeight(n) { return ROW_HEIGHT[n] || ROW_HEIGHT[3]; }

function jItem(listPath, index) {
  const { inner, tools, clickable, item, path } = mediaFill(listPath, index);
  const ratio = item.ratio || 4 / 3;
  return `<div class="jitem ${clickable}" data-media="${path}" style="flex:${ratio} ${ratio} 0">${inner}${tools}</div>`;
}

function mediaRows(listPath, layoutIndex) {
  const list = getPath(listPath);
  const cycle = ROW_CYCLES[layoutIndex % ROW_CYCLES.length];
  let out = '', buf = [], cyclePos = 0;
  const flush = () => {
    if (!buf.length) return;
    if (buf.length === 1 && list[buf[0]].kind === 'video') {
      const { inner, tools, path } = mediaFill(listPath, buf[0]);
      out += `<div class="jrow-solo"><figure class="media ratio-16x9" data-media="${path}" style="margin:0">${inner}${tools}</figure></div>`;
    } else {
      out += `<div class="jrow" style="--rh:${rowHeight(buf.length)}">${buf.map(i => jItem(listPath, i)).join('')}</div>`;
    }
    buf = [];
  };
  list.forEach((it, i) => {
    if (it.kind === 'video') { flush(); buf = [i]; flush(); return; }
    buf.push(i);
    if (buf.length >= cycle[cyclePos % cycle.length]) { flush(); cyclePos++; }
  });
  flush();
  out += `<button class="add-box" data-act="add-media" data-path="${listPath}" style="display:flex;width:100%;min-height:64px;margin-top:var(--gap)">＋ Add media</button>`;
  return `<div class="media-rows">${out}</div>`;
}

function mediaList(listPath, ratio, gridCls) {
  const list = getPath(listPath);
  const boxes = list.map((_, i) => mediaBox(listPath, i, ratio)).join('');
  const grid = gridCls || (list.length <= 1 ? 'grid-1' : list.length === 2 ? 'grid-2' : list.length === 3 ? 'grid-3' : 'grid-4');
  return `<div class="${grid}">${boxes}
    <button class="add-box" data-act="add-media" data-path="${listPath}">＋ Add media</button>
  </div>`;
}

function updateSlider() {
  const track = document.getElementById('sliderTrack');
  if (!track) return;
  const n = Math.max(1, state.documentation.gallery.items.length);
  slideIndex = Math.min(slideIndex, n - 1);
  track.style.transform = `translateX(-${slideIndex * 100}%)`;
  document.getElementById('slideCount').textContent =
    String(slideIndex + 1).padStart(2, '0') + ' / ' + String(n).padStart(2, '0');
  document.getElementById('slideProgress').style.width = ((slideIndex + 1) / n * 100) + '%';
}

/* ============================================================
   ACTIONS
   ============================================================ */
document.body.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]');

  /* lightbox from non-edit clicks on media */
  if (!t && !editing) {
    const fig = e.target.closest('[data-media]');
    if (fig) {
      const p = fig.dataset.media;
      const listPath = p.slice(0, p.lastIndexOf('.'));
      const idx = Number(p.slice(p.lastIndexOf('.') + 1));
      const list = getPath(listPath).filter(m => m.src);
      const item = getPath(p);
      if (item.src && item.kind === 'image') openLightbox(list, list.findIndex(m => m.id === item.id));
    }
    return;
  }
  if (!t) return;
  const act = t.dataset.act;
  const path = t.dataset.path;

  if (act === 'go') { state.page = t.dataset.page; slideIndex = 0; render(false); window.scrollTo(0, 0); return; }

  if (act === 'light-photo' && !editing) {
    const list = state.photography.items.filter(m => m.src);
    const item = state.photography.items[Number(t.dataset.index)];
    openLightbox(list, Math.max(0, list.findIndex(m => m.id === item.id)));
    return;
  }

  if (!editing && ['set-media', 'del-media', 'add-media', 'add-project', 'del-project', 'set-logo', 'set-thumb', 'set-pdf', 'add-doc', 'del-doc', 'move-item', 'move-slide', 'del-section', 'add-section', 'clear-field'].includes(act)) {
    toast('Turn on “Edit site” first.'); return;
  }

  switch (act) {
    case 'set-logo':
      if (!editing) return;
      pickFile('image/*', async files => { const r = await compressImage(files[0], 600, 0.92); state.logo = r.url; render(); save(); });
      break;

    case 'set-portrait':
      pickFile('image/*', async files => { const r = await compressImage(files[0]); state.about.portrait = r.url; render(); save(); });
      break;

    case 'set-media': {
      const item = getPath(path);
      if (item.kind === 'video') chooseVideo(path); else
        pickFile('image/*', async files => { const r = await compressImage(files[0]); item.src = r.url; item.ratio = r.ratio; render(); save(); });
      break;
    }

    case 'del-media': {
      const listPath = path.slice(0, path.lastIndexOf('.'));
      const idx = Number(path.slice(path.lastIndexOf('.') + 1));
      getPath(listPath).splice(idx, 1);
      render(); save(); break;
    }

    case 'move-item': {
      const ok = moveItem(path, Number(t.dataset.dir));
      if (ok) { render(); save(); }
      break;
    }

    case 'move-slide': {
      const dir = Number(t.dataset.dir);
      const ok = moveItem(`documentation.gallery.items.${slideIndex}`, dir);
      if (ok) { slideIndex += dir; render(); save(); }
      break;
    }

    case 'clear-field': {
      setPath(path, '');
      render(); save();
      break;
    }

    case 'del-section': {
      const key = t.dataset.key;
      confirmAction(`Remove “${SECTION_LABELS[key] || key}” from the page?`, () => {
        const order = state.documentation.order;
        const idx = order.indexOf(key);
        if (idx > -1) order.splice(idx, 1);
        render(); save();
      }, 'Its content stays saved — you can add it back any time from “＋ Add section”.');
      break;
    }

    case 'add-section':
      addSectionChooser();
      break;

    case 'add-media':
      if (!editing) { toast('Turn on “Edit site” first.'); return; }
      addMediaChooser(path);
      break;

    case 'cycle-layout': {
      if (!editing) { toast('Turn on “Edit site” first.'); return; }
      const i = Number(t.dataset.index);
      const p = state.projects.items[i];
      const cur = Number.isInteger(p.layout) ? p.layout : i % ROW_CYCLES.length;
      p.layout = (cur + 1) % ROW_CYCLES.length;
      render(); save(); break;
    }

    case 'add-project':
      state.projects.items.push({ id: uid(), title: 'New project', quote: 'A short quote or one-line thesis.', body: 'Write the project description here.', media: [img(), img(), img(), img()] });
      render(); save(); break;

    case 'del-project':
      confirmAction('Remove this project?', () => { state.projects.items.splice(Number(t.dataset.index), 1); render(); save(); });
      break;

    case 'set-thumb':
      pickFile('image/*', async files => { const r = await compressImage(files[0], 1200); getPath(path).thumb = r.url; render(); save(); });
      break;

    case 'set-pdf':
      pickFile('application/pdf', async files => {
        const f = files[0];
        getPath(path).pdf = await readDataURL(f);
        getPath(path).pdfName = f.name;
        render(); save();
        if (f.size > 3_000_000) toast('Large PDF attached — remember to Export to keep it.');
      });
      break;

    case 'open-pdf': {
      const it = getPath(path);
      if (editing) { toast('Turn off Edit site to open the PDF.'); return; }
      if (!it.pdf) { toast('No PDF attached yet.'); return; }
      openPdf(it.pdf, it.pdfName || 'document.pdf');
      break;
    }

    case 'add-doc':
      getPath(path).items.push({ id: uid(), title: 'New document', meta: 'PDF', thumb: '', pdf: '', pdfName: '' });
      render(); save(); break;

    case 'del-doc':
      getPath(path).items.splice(Number(t.dataset.index), 1); render(); save(); break;

    case 'add-gallery':
      if (!editing) { toast('Turn on “Edit site” first.'); return; }
      pickFile('image/*', async files => {
        for (const f of files) { const r = await compressImage(f, 2000, 0.84); state.documentation.gallery.items.push({ ...img(), src: r.url, ratio: r.ratio }); }
        render(); save();
      }, true);
      break;

    case 'del-slide':
      if (!editing) { toast('Turn on “Edit site” first.'); return; }
      state.documentation.gallery.items.splice(slideIndex, 1);
      slideIndex = Math.max(0, slideIndex - 1); render(); save(); break;

    case 'slide': {
      const n = state.documentation.gallery.items.length || 1;
      slideIndex = (slideIndex + Number(t.dataset.dir) + n) % n;
      updateSlider(); break;
    }

    case 'add-photos':
      if (!editing) { toast('Turn on “Edit site” first.'); return; }
      pickFile('image/*', async files => {
        for (const f of files) { const r = await compressImage(f, 1800, 0.84); state.photography.items.push({ ...img(), src: r.url, ratio: r.ratio }); }
        render(); save();
      }, true);
      break;

    case 'add-vol':
      state.about.volunteering.items.push({ id: uid(), title: 'New section', role: 'Role', body: 'Description.', media: [img(), img(), img()] });
      render(); save(); break;

    case 'del-vol':
      confirmAction('Remove this section?', () => { state.about.volunteering.items.splice(Number(t.dataset.index), 1); render(); save(); });
      break;

    case 'modal-close': closeModal(); break;
  }
});

/* choosing what kind of media to add to a list */
function addMediaChooser(listPath) {
  openModal(`
    <h3>Add media</h3>
    <p>Add another box to this row of media — a photo or a video.</p>
    <div class="modal-actions">
      <button id="addPhotoBtn">Add a photo</button>
      <button id="addVideoBtn">Add a video</button>
    </div>
    <button class="modal-close" data-act="modal-close">Cancel</button>`);
  document.getElementById('addPhotoBtn').onclick = () => {
    closeModal();
    pickFile('image/*', async files => {
      for (const f of files) {
        const r = await compressImage(f);
        getPath(listPath).push({ ...img(), src: r.url, ratio: r.ratio });
      }
      render(); save();
    }, true);
  };
  document.getElementById('addVideoBtn').onclick = () => { closeModal(); addVideoToList(listPath); };
}

function addVideoToList(listPath) {
  openModal(`
    <h3>Add a video</h3>
    <p>Upload a file, or paste a link from YouTube, Vimeo, Loom, or Wistia. Links keep the file size down.</p>
    <div class="modal-actions">
      <button data-vid="file">Upload a video file</button>
      <button data-vid="link">Paste a video link</button>
    </div>
    <button class="modal-close" data-act="modal-close">Cancel</button>`);
  modalCard.querySelector('[data-vid="file"]').onclick = () => {
    closeModal();
    pickFile('video/*', async files => {
      const nv = vid();
      nv.src = await readDataURL(files[0]);
      getPath(listPath).push(nv);
      render(); save();
      if (files[0].size > 5_000_000) toast('Large video — export the site to keep it, auto-save may skip it.');
    });
  };
  modalCard.querySelector('[data-vid="link"]').onclick = () => {
    openModal(`
      <h3>Video link</h3>
      <p>Paste a link from YouTube, Vimeo, Loom, or Wistia — it's converted to an embed automatically. A YouTube video should be set to Unlisted, not Private, so it can actually play here.</p>
      <input type="text" id="vidUrl" placeholder="https://www.youtube.com/watch?v=…">
      <div class="modal-actions"><button id="vidGo">Add video</button></div>
      <button class="modal-close" data-act="modal-close">Cancel</button>`);
    const go = () => {
      const url = document.getElementById('vidUrl').value.trim();
      const em = toEmbed(url);
      if (!em) { toast('That link was not recognised — try a YouTube, Vimeo, Loom, or Wistia URL.'); return; }
      const nv = vid();
      nv.embed = em;
      getPath(listPath).push(nv);
      closeModal(); render(); save();
    };
    document.getElementById('vidGo').onclick = go;
    document.getElementById('vidUrl').onkeydown = e => { if (e.key === 'Enter') go(); };
    document.getElementById('vidUrl').focus();
  };
}

/* video chooser for an existing single box (Replace) */
function chooseVideo(path) {
  openModal(`
    <h3>Add a video</h3>
    <p>Upload a file, or paste a link from YouTube, Vimeo, Loom, or Wistia. Links keep the file size down.</p>
    <div class="modal-actions">
      <button data-vid="file">Upload a video file</button>
      <button data-vid="link">Paste a video link</button>
    </div>
    <button class="modal-close" data-act="modal-close">Cancel</button>`);
  modalCard.querySelector('[data-vid="file"]').onclick = () => {
    closeModal();
    pickFile('video/*', async files => {
      const it = getPath(path);
      it.src = await readDataURL(files[0]); it.embed = '';
      render(); save();
      if (files[0].size > 5_000_000) toast('Large video — export the site to keep it, auto-save may skip it.');
    });
  };
  modalCard.querySelector('[data-vid="link"]').onclick = () => {
    openModal(`
      <h3>Video link</h3>
      <p>Paste a link from YouTube, Vimeo, Loom, or Wistia — it's converted to an embed automatically. A YouTube video should be set to Unlisted, not Private, so it can actually play here.</p>
      <input type="text" id="vidUrl" placeholder="https://www.youtube.com/watch?v=…">
      <div class="modal-actions"><button id="vidGo">Add video</button></div>
      <button class="modal-close" data-act="modal-close">Cancel</button>`);
    const go = () => {
      const url = document.getElementById('vidUrl').value.trim();
      const em = toEmbed(url);
      if (!em) { toast('That link was not recognised — try a YouTube, Vimeo, Loom, or Wistia URL.'); return; }
      const it = getPath(path); it.embed = em; it.src = '';
      closeModal(); render(); save();
    };
    document.getElementById('vidGo').onclick = go;
    document.getElementById('vidUrl').onkeydown = e => { if (e.key === 'Enter') go(); };
    document.getElementById('vidUrl').focus();
  };
}
function toEmbed(url) {
  let m = url.match(/(?:youtube\.com\/.*[?&]v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([\w-]{6,})/);
  if (m) return 'https://www.youtube.com/embed/' + m[1];
  m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return 'https://player.vimeo.com/video/' + m[1];
  m = url.match(/loom\.com\/share\/([a-zA-Z0-9]+)/);
  if (m) return 'https://www.loom.com/embed/' + m[1];
  m = url.match(/(?:wistia\.com|wi\.st)\/medias\/([a-zA-Z0-9]+)/);
  if (m) return 'https://fast.wistia.net/embed/iframe/' + m[1];
  m = url.match(/dailymotion\.com\/video\/([a-zA-Z0-9]+)/);
  if (m) return 'https://www.dailymotion.com/embed/video/' + m[1];
  if (/^https?:\/\//.test(url)) return url;
  return '';
}

function confirmAction(msg, fn, note) {
  openModal(`<h3>${esc(msg)}</h3><p>${note ? esc(note) : 'This cannot be undone.'}</p>
    <div class="modal-actions"><button id="okBtn">Remove</button></div>
    <button class="modal-close" data-act="modal-close">Cancel</button>`);
  document.getElementById('okBtn').onclick = () => { closeModal(); fn(); };
}

function addSectionChooser() {
  if (!editing) { toast('Turn on “Edit site” first.'); return; }
  const order = state.documentation.order;
  const hidden = Object.keys(SECTION_LABELS).filter(k => !order.includes(k));
  if (!hidden.length) { toast('All sections are already on the page.'); return; }
  openModal(`
    <h3>Add a section</h3>
    <p>Bring a hidden section back onto the Documentation page. Its content is unchanged.</p>
    <div class="modal-actions">${hidden.map(k => `<button data-addsec="${k}">${esc(SECTION_LABELS[k])}</button>`).join('')}</div>
    <button class="modal-close" data-act="modal-close">Cancel</button>`);
  hidden.forEach(k => {
    modalCard.querySelector(`[data-addsec="${k}"]`).onclick = () => {
      state.documentation.order.push(k);
      closeModal(); render(); save();
    };
  });
}

function openPdf(dataUrl, name) {
  try {
    const [meta, b64] = dataUrl.split(',');
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const blob = new Blob([arr], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const w = window.open(url, '_blank');
    if (!w) { const a = document.createElement('a'); a.href = url; a.download = name; a.click(); toast('PDF downloaded — pop-ups are blocked here.'); }
  } catch (e) { toast('Could not open that PDF.'); }
}

/* text editing */
document.body.addEventListener('paste', e => {
  const el = e.target.closest('[data-bind]');
  if (!el || !editing) return;
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, text);
});
document.body.addEventListener('focusout', e => {
  const el = e.target.closest('[data-bind]');
  if (!el || !editing) return;
  const val = el.innerText.replace(/\u00a0/g, ' ').trim();
  if (val !== String(getPath(el.dataset.bind) ?? '')) { setPath(el.dataset.bind, val); save(); }
});

/* ============================================================
   TOOLBAR
   ============================================================ */
document.getElementById('btnEdit').addEventListener('click', () => {
  editing = !editing;
  document.body.classList.toggle('editing', editing);
  document.getElementById('btnEdit').textContent = editing ? 'Done editing' : 'Edit site';
  render();
  if (editing) toast('Click any text to rewrite it. Use Add / Replace / Remove on the boxes.');
});

document.getElementById('btnSave').addEventListener('click', async () => {
  const btn = document.getElementById('btnSave');
  btn.textContent = 'Saving…';
  const ok = await save();
  if (ok) {
    btn.textContent = 'Saved ✓';
    toast('Saved to this conversation. If you can, also press Export to download a real backup file.');
  } else {
    btn.textContent = 'Save';
    toast('Could not save here — this window can’t reach that storage. Press Export now to keep your work.');
  }
  setTimeout(() => { btn.textContent = 'Save'; }, 2200);
});

/* safety net: save whenever the tab is hidden or about to close, so closing
   without pressing Save doesn't lose recent edits */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
window.addEventListener('pagehide', () => { save(); });

document.getElementById('btnExport').addEventListener('click', () => {
  const clone = document.documentElement.cloneNode(true);
  clone.querySelector('#seed').textContent = JSON.stringify(state);
  clone.querySelector('#masthead').innerHTML = '';
  clone.querySelector('#app').innerHTML = '';
  clone.querySelector('#toast').textContent = '';
  clone.querySelector('#modalCard').innerHTML = '';
  clone.querySelector('#lbStage').innerHTML = '';
  clone.querySelector('body').className = '';
  const html = '<!DOCTYPE html>\n' + clone.outerHTML;
  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (state.wordmark || 'portfolio').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.html';
  a.click();
  toast('Exported. That single file is your whole site — open it anywhere or upload it to a host.');
});

document.getElementById('btnImport').addEventListener('click', () => {
  pickFile('text/html,application/json', async files => {
    const text = await files[0].text();
    let json = null;
    const m = text.match(/<script id="seed" type="application\/json">([\s\S]*?)<\/script>/);
    try { json = JSON.parse(m ? m[1] : text); } catch (e) {}
    if (!json) { toast('Could not read that file — import an exported site file.'); return; }
    state = Object.assign(defaultState(), json);
    render(false); save();
    toast('Site loaded.');
  });
});

document.getElementById('btnHelp').addEventListener('click', () => {
  openModal(`
    <h3>How this works</h3>
    <p><strong>Edit site</strong> turns on editing: click any text to rewrite it, and use Add / Replace / Remove on any image or video box. “＋ Add media” lets you add another photo or video box; Remove takes any box away.</p>
    <p><strong>Reordering</strong> works everywhere: projects, documents, photos, and volunteering sections have ↑ Move up / ↓ Move down links; media boxes have small ‹ › arrows to shift them earlier or later; and each Documentation section (Construction, Concept, Gallery) can be moved up or down, removed from the page, or added back with “＋ Add section”.</p>
    <p><strong>Save</strong> stores your work in this artifact — come back to this conversation later and it reloads as you left it. <strong>Export</strong> is your real backup: a single file with everything baked in, safe to keep even if this conversation is gone.</p>
    <p><strong>Documents</strong> take a thumbnail and a PDF. With editing off, clicking one opens the PDF.</p>
    <p><strong>Export</strong> saves everything — text, images, videos, PDFs — into one HTML file you can open offline or upload to any host.</p>
    <div class="modal-actions"><button id="resetBtn">Reset to the blank template</button></div>
    <button class="modal-close" data-act="modal-close">Close</button>`);
  document.getElementById('resetBtn').onclick = () => {
    closeModal();
    confirmAction('Reset everything?', () => { state = defaultState(); render(false); save(); });
  };
});

/* swipe on slider */
let touchX = null;
document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  if (touchX == null || !e.target.closest('#slider')) { touchX = null; return; }
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 45) {
    const n = state.documentation.gallery.items.length || 1;
    slideIndex = (slideIndex + (dx < 0 ? 1 : -1) + n) % n;
    updateSlider();
  }
  touchX = null;
}, { passive: true });

/* boot */
(async () => { await load(); render(false); })();
</script>
